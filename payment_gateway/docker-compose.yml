version: '3.8'

services:
  mongodb:
    image: mongo:5.0
    container_name: payment_gateway_mongodb
    environment:
      MONGO_INITDB_DATABASE: payment_gateway
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: payment_gateway_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment_gateway_api
    environment:
      DATABASE_URL: mongodb://mongodb:27017/payment_gateway
      REDIS_URL: redis://redis:6379
      SECRET_KEY: your_secret_key_here
      ENCRYPTION_KEY: your_encryption_key_32_chars_here
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mongo_data: